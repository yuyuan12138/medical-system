spring.datasource.url=jdbc:h2:mem:medical_db;NON_KEYWORDS=YEAR;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
server.error.include-message=always
server.error.include-stacktrace=always
spring.jpa.open-in-view=false

storage.s3.endpoint-internal=http://localhost:9000
storage.s3.endpoint-external=http://localhost:9000
# DEV-ONLY placeholders for the local H2 profile (spring.profiles.active=h2).
# Production must set the STORAGE_S3_ACCESS_KEY / STORAGE_S3_SECRET_KEY env vars (no defaults).
storage.s3.access-key=dev-h2-local-access-key
storage.s3.secret-key=dev-h2-local-secret-key
storage.s3.bucket=medical-attachments
storage.s3.region=us-east-1

# DEV-ONLY JWT secret for local H2 development; production must use the JWT_SECRET env var.
jwt.secret=dev-h2-local-jwt-secret-do-not-use-in-production-0000000
