spring.datasource.url=jdbc:h2:mem:testdb;NON_KEYWORDS=YEAR
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

storage.s3.endpoint-internal=http://localhost:9000
storage.s3.endpoint-external=http://localhost:9000
storage.s3.access-key=minioadmin
storage.s3.secret-key=miniopassword
storage.s3.bucket=medical-attachments
storage.s3.region=us-east-1

# TEST-ONLY JWT secret so the test context can construct JwtService (production requires the
# JWT_SECRET env var; the main application.properties deliberately ships no default).
jwt.secret=test-only-jwt-secret-for-local-suite-000000000000
